# One worker keeps the short E10 demonstration sequence deterministic. In a
# production high-throughput deployment this can be changed back to auto.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" upstream=$upstream_addr';
    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream web_pool {
        # Nginx uses round-robin when no alternative balancing method is set.
        server web-frontend-server:80;
        server web-frontend-server2:80;
    }

    upstream application_backend {
        server application-backend-server:8081;
    }

    upstream identity_backend {
        server authentication-identity-server:8080;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /student/ {
            proxy_pass http://application_backend/student;
        }

        location /api/ {
            # The trailing slash removes the /api/ prefix before proxying.
            proxy_pass http://application_backend/;
        }

        location = /auth {
            return 301 /auth/;
        }

        location /auth/ {
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_pass http://identity_backend/;
        }

        location / {
            proxy_pass http://web_pool;
        }
    }
}
