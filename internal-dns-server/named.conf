// =============================================================
// Bind9 Configuration – Internal DNS Server (MyMiniCloud)
// Maintainer: Tuấn Anh (TV2)
// =============================================================

options {
    directory "/var/cache/bind";

    // Lắng nghe trên cổng 53, mọi interface
    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };

    // Cho phép mọi client query
    allow-query { any; };

    // Tắt recursion – chỉ phục vụ zone nội bộ
    recursion no;

    // Ẩn version
    version "not available";
};

// =============================================================
// Master Zone: cloud.local
// =============================================================
zone "cloud.local" IN {
    type master;
    file "/etc/bind/zones/db.cloud.local";
    allow-transfer { none; };
};
