name: ${COMPOSE_PROJECT_NAME:-myminicloud}

services:
  web-frontend-server:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:stage3
    container_name: web-frontend-server
    ports:
      - "127.0.0.1:8080:80"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.10
    restart: unless-stopped

  web-frontend-server2:
    build:
      context: ./web-frontend-server
      dockerfile: Dockerfile.web2
    image: myminicloud-web2:stage5
    container_name: web-frontend-server2
    networks:
      cloud-net:
        ipv4_address: 10.10.10.11
    restart: unless-stopped

  application-backend-server:
    build:
      context: ./application-backend-server
    image: myminicloud-backend:stage5
    container_name: application-backend-server
    environment:
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      DB_HOST: ${DB_HOST:-relational-database-server}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-studentdb}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-flask-app}
    ports:
      - "127.0.0.1:8085:8081"
    depends_on:
      relational-database-server:
        condition: service_healthy
    networks:
      cloud-net:
        ipv4_address: 10.10.10.20
    restart: unless-stopped

  relational-database-server:
    image: mariadb:10.11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-minicloud}
      MARIADB_USER: ${MARIADB_USER:-minicloud_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      cloud-net:
        ipv4_address: 10.10.10.25
    restart: unless-stopped

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:24.0
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      cloud-net:
        ipv4_address: 10.10.10.40
    restart: unless-stopped

  object-storage-server:
    image: bitnami/minio:latest
    container_name: object-storage-server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      cloud-net:
        ipv4_address: 10.10.10.30
    restart: unless-stopped

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports:
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/zones:/etc/bind/zones:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.50
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    networks:
      cloud-net:
        ipv4_address: 10.10.10.60
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:v2.53.0
    container_name: monitoring-prometheus-server
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    depends_on:
      - node-exporter
      - web-frontend-server
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      cloud-net:
        ipv4_address: 10.10.10.61
    restart: unless-stopped

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:11.1.0
    container_name: monitoring-grafana-dashboard-server
    depends_on:
      - monitoring-prometheus-server
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring-grafana-dashboard-server/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring-grafana-dashboard-server/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring-grafana-dashboard-server/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.62
    restart: unless-stopped

  api-gateway-proxy-server:
    image: nginx:1.27-alpine
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
      - web-frontend-server2
      - application-backend-server
      - authentication-identity-server
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.70
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

volumes:
  mariadb_data:
  keycloak_data:
  minio_data:
  prometheus_data:
  grafana_data:
