global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: web
    metrics_path: /metrics
    # The lab web endpoint serves Prometheus text exposition from a static file.
    static_configs:
      - targets:
          - web-frontend-server:80
