name: ${COMPOSE_PROJECT_NAME:-myminicloud}

services:
  # Stage 3 includes Web 1 because Prometheus E7 scrapes its /metrics endpoint.
  # Remaining MyMiniCloud services are added during the final integration stage.
  web-frontend-server:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:stage3
    container_name: web-frontend-server
    ports:
      - "8080:80"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.10
    restart: unless-stopped

  web-frontend-server2:
    build:
      context: ./web-frontend-server
      dockerfile: Dockerfile.web2
    image: myminicloud-web2:stage5
    container_name: web-frontend-server2
    networks:
      cloud-net:
        ipv4_address: 10.10.10.11
    restart: unless-stopped

  application-backend-server:
    build:
      context: ./application-backend-server
    image: myminicloud-backend:stage5
    container_name: application-backend-server
    environment:
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      DB_HOST: ${DB_HOST:-relational-database-server}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-studentdb}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-flask-app}
    ports:
      - "8085:8081"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.20
    restart: unless-stopped

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      cloud-net:
        ipv4_address: 10.10.10.40
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    pid: host
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
    networks:
      cloud-net:
        ipv4_address: 10.10.10.60
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:v3.13.5
    container_name: monitoring-prometheus-server
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    depends_on:
      - node-exporter
      - web-frontend-server
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      cloud-net:
        ipv4_address: 10.10.10.61
    restart: unless-stopped

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:13.3.0
    container_name: monitoring-grafana-dashboard-server
    depends_on:
      - monitoring-prometheus-server
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring-grafana-dashboard-server/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring-grafana-dashboard-server/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring-grafana-dashboard-server/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.62
    restart: unless-stopped

  api-gateway-proxy-server:
    image: nginx:1.30.6-alpine
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
      - web-frontend-server2
      - application-backend-server
      - authentication-identity-server
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.70
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

volumes:
  keycloak_data:
  prometheus_data:
  grafana_data:
